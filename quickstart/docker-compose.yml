services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: fly
      MARIADB_USER: runhive_demo
      MARIADB_PASSWORD: <redacted>
      MARIADB_ROOT_PASSWORD: <redacted>
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - yes
    volumes:
      - redis-data:/data
  php:
    build:
      context: ..
      dockerfile: quickstart/php/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      WEB_DOCUMENT_ROOT: /srv/runhive/backend/public
      PHP_DATE_TIMEZONE: Asia/Shanghai
      PHP_MEMORY_LIMIT: 512M
      SERVICE_NGINX_CLIENT_MAX_BODY_SIZE: 100m
      RUNOS_LAN_HOSTS: 127.0.0.1,localhost
      RUNOS_LAN_PORT: 14000
    volumes:
      - ./runtime:/srv/runhive/runtime
  web:
    image: nginx:1.29.4
    depends_on:
      - php
    ports:
      - "${DEMO_PORT:-1819}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  db-data:
  redis-data:
